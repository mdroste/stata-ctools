name: Build Plugins

on:
  push:
    branches: [ main, dev, develop ]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'build/*.ado'
      - 'build/*.sthlp'
      - 'build/*.pkg'
      - 'build/stata.toc'
      - 'build/LICENSE'
      - 'build/THIRD_PARTY_NOTICES'
      - 'build/ctools-codecs-LICENSE.txt'
      - 'scripts/**'
      - 'validation/**'
      - 'config/release.json'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, dev, develop ]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'build/*.ado'
      - 'build/*.sthlp'
      - 'build/*.pkg'
      - 'build/stata.toc'
      - 'build/LICENSE'
      - 'build/THIRD_PARTY_NOTICES'
      - 'build/ctools-codecs-LICENSE.txt'
      - 'scripts/**'
      - 'validation/**'
      - 'config/release.json'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish_plugins:
        description: 'Update the installable plugins on main after checks pass'
        type: boolean
        required: false
        default: false
  release:
    types: [created]

# Superseded branch builds must not publish binaries from an older source tree.
concurrency:
  group: ctools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Linux x64 Build
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libgomp1
          # Note: Linux uses dynamic libgomp (static linking not possible for shared libs)

      - name: Validate native code and release metadata
        run: |
          python3 scripts/sync_release.py --check
          python3 validation/run.py --checks package build --metadata-only
          python3 validation/run.py --checks docs
          CC=gcc python3 validation/run.py --native

      - name: Check adaptive transport memory ownership
        env:
          CC: gcc
          CTOOLS_SANITIZERS: address,undefined
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          python3 validation/run.py --native test_transport_adaptive_native
          python3 validation/run.py --native test_transport_store_native
          python3 validation/run.py --native test_rowstage_native

      - name: Build Linux plugin
        run: make linux BUILD_REVISION=${{ github.sha }}

      - name: Check Linux dependency contract
        run: python3 validation/run.py --checks dependencies linux build/ctools_linux.plugin

      - name: Upload Linux plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_linux
          path: build/ctools_linux.plugin
          if-no-files-found: error

  # ===========================================================================
  # macOS Apple Silicon (ARM64) Build
  # ===========================================================================
  build-macos-arm:
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build OpenMP for macOS 11
        run: python3 scripts/build_macos_openmp.py arm64 "$RUNNER_TEMP/libomp" --work "$RUNNER_TEMP/llvm-openmp"

      - name: Build macOS plugin
        run: make macos-arm LIBOMP_PREFIX="$RUNNER_TEMP/libomp" BUILD_REVISION=${{ github.sha }}

      - name: Check macOS dependency contract
        run: python3 validation/run.py --checks dependencies macos build/ctools_mac_arm.plugin --arch arm64

      - name: Upload macOS ARM plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_mac_arm
          path: build/ctools_mac_arm.plugin
          if-no-files-found: error

  # ===========================================================================
  # macOS Intel (x86_64) Build
  # ===========================================================================
  build-macos-intel:
    runs-on: macos-15-intel  # Standard Intel runner (x86_64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build OpenMP for macOS 11
        run: python3 scripts/build_macos_openmp.py x86_64 "$RUNNER_TEMP/libomp" --work "$RUNNER_TEMP/llvm-openmp"

      - name: Build macOS plugin
        run: make macos-intel LIBOMP_PREFIX="$RUNNER_TEMP/libomp" BUILD_REVISION=${{ github.sha }}

      - name: Check macOS dependency contract
        run: python3 validation/run.py --checks dependencies macos build/ctools_mac_x86.plugin --arch x86_64

      - name: Upload macOS Intel plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_mac_x86
          path: build/ctools_mac_x86.plugin
          if-no-files-found: error

  # ===========================================================================
  # Windows x64 Build
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache MSYS2 packages
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pkgs-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-winpthreads-git
            mingw-w64-x86_64-python

      - name: Build Windows plugin
        shell: msys2 {0}
        run: make windows BUILD_REVISION=${{ github.sha }}

      - name: Test Windows file APIs and MSYS2 cleanup
        shell: msys2 {0}
        run: python validation/run.py --checks windows

      - name: Check Windows dependency contract
        shell: msys2 {0}
        run: python validation/run.py --checks dependencies windows build/ctools_windows.plugin

      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          # Only the signing job may provide the distributable artifact outside PRs.
          name: ${{ github.event_name == 'pull_request' && 'ctools_windows' || 'windows-unsigned' }}
          path: build/ctools_windows.plugin
          if-no-files-found: error

  sign-windows:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/develop' ||
       (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')))
    needs: build-windows
    runs-on: windows-2025
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
                        'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Set $name in the windows-signing GitHub environment; see docs/development/WINDOWS_SIGNING.md."
            }
          }

      - name: Download this run's unsigned Windows plugin
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: signing

      - name: Prepare DLL for Authenticode tools
        shell: pwsh
        run: |
          # The Stata plugin is a PE DLL. Use its conventional extension for signing
          # and verification, then restore the Stata filename without changing bytes.
          Move-Item -LiteralPath signing/ctools_windows.plugin -Destination signing/ctools_windows.dll

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign and timestamp Windows plugin
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\signing\ctools_windows.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false

      - name: Verify signature and timestamp
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath signing/ctools_windows.dll
          if ($signature.Status -ne 'Valid') {
            throw "Windows plugin signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'Windows plugin has no trusted timestamp.'
          }
          Move-Item -LiteralPath signing/ctools_windows.dll -Destination signing/ctools_windows.plugin
          $hash = (Get-FileHash -LiteralPath signing/ctools_windows.plugin -Algorithm SHA256).Hash
          @('Windows plugin signature: valid',
            "Publisher: $($signature.SignerCertificate.Subject)",
            "Certificate: $($signature.SignerCertificate.Thumbprint)",
            "SHA256: $hash") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload signed Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_windows
          path: signing/ctools_windows.plugin
          if-no-files-found: error

  # ===========================================================================
  # Combine all artifacts into single release package
  # ===========================================================================
  package:
    needs: [build-linux, build-macos-arm, build-macos-intel, build-windows, sign-windows]
    if: >-
      always() && !cancelled() &&
      needs.build-linux.result == 'success' &&
      needs.build-macos-arm.result == 'success' &&
      needs.build-macos-intel.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (needs.sign-windows.result == 'success' ||
       (github.event_name == 'pull_request' && needs.sign-windows.result == 'skipped'))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: plugins
          pattern: ctools_*

      - name: Organize plugins
        run: |
          python3 scripts/sync_release.py --check
          python3 scripts/stage_package.py --platform all --binaries plugins --output release/build --revision '${{ github.sha }}'
          printf '%s\n' '${{ github.sha }}' > release/SOURCE_COMMIT

      - name: Create versioned install archive
        id: archive
        run: |
          archive=$(python3 scripts/archive_package.py release/build --output dist)
          echo "name=$(basename "$archive" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload versioned install archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: ctools-all-platforms
          path: release/
          if-no-files-found: error

  # ===========================================================================
  # Publish plugins to main when explicitly requested
  # ===========================================================================
  commit-plugins:
    if: >-
      always() && !cancelled() && needs.package.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.publish_plugins &&
      github.ref == 'refs/heads/main'
    needs: [package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ctools-all-platforms
          path: release

      - name: Copy plugins to build directory
        run: |
          mkdir -p build
          cp release/build/*.plugin build/
          echo "Plugins copied to build/:"
          ls -la build/

      - name: Commit and push
        run: |
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main advanced after this build; refusing stale plugin publication"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/*.plugin
          git diff --staged --quiet || git commit -m "Update compiled plugins [skip ci]"
          git push origin HEAD:main

  # ===========================================================================
  # Attach archives to manually created releases
  # ===========================================================================
  release:
    if: >-
      always() && !cancelled() && needs.package.result == 'success' &&
      github.event_name == 'release'
    needs: [package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ctools-all-platforms
          path: release

      - name: Create release archive
        run: |
          python3 scripts/archive_package.py release/build --output dist

      - name: Upload to manual release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/ctools-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
