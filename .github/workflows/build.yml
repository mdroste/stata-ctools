name: Build Plugins

on:
  push:
    branches: [ main, dev, develop ]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'build/*.ado'
      - 'build/*.sthlp'
      - 'build/*.pkg'
      - 'build/stata.toc'
      - 'build/LICENSE'
      - 'build/THIRD_PARTY_NOTICES'
      - 'scripts/**'
      - 'validation/**'
      - 'release.json'
      - 'README.md'
      - 'FEATURES.md'
      - 'DEVELOPERS.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, dev, develop ]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'build/*.ado'
      - 'build/*.sthlp'
      - 'build/*.pkg'
      - 'build/stata.toc'
      - 'build/LICENSE'
      - 'build/THIRD_PARTY_NOTICES'
      - 'scripts/**'
      - 'validation/**'
      - 'release.json'
      - 'README.md'
      - 'FEATURES.md'
      - 'DEVELOPERS.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  release:
    types: [created]

# Superseded branch builds must not publish binaries from an older source tree.
concurrency:
  group: ctools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Linux x64 Build
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libgomp1
          # Note: Linux uses dynamic libgomp (static linking not possible for shared libs)

      - name: Validate native code and release metadata
        run: |
          python3 scripts/sync_release.py --check
          python3 validation/check_package.py build --metadata-only
          CC=gcc python3 validation/test_p1_native.py
          CC=gcc python3 validation/test_p2_native.py
          CC=gcc python3 validation/test_sep22_native.py
          CC=gcc CTOOLS_SANITIZERS=address,undefined python3 validation/test_sep24_native.py
          python3 validation/test_release_gate.py
          python3 validation/test_build_contract.py

      - name: Build Linux plugin
        run: make linux BUILD_REVISION=${{ github.sha }}

      - name: Check Linux dependency contract
        run: python3 validation/check_dependencies.py linux build/ctools_linux.plugin

      - name: Upload Linux plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_linux
          path: build/ctools_linux.plugin
          if-no-files-found: error

  # ===========================================================================
  # macOS Apple Silicon (ARM64) Build
  # ===========================================================================
  build-macos-arm:
    runs-on: macos-14  # M1 runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build OpenMP for macOS 11
        run: python3 scripts/build_macos_openmp.py arm64 "$RUNNER_TEMP/libomp" --work "$RUNNER_TEMP/llvm-openmp"

      - name: Build macOS plugin
        run: make macos-arm LIBOMP_PREFIX="$RUNNER_TEMP/libomp" BUILD_REVISION=${{ github.sha }}

      - name: Check macOS dependency contract
        run: python3 validation/check_dependencies.py macos build/ctools_mac_arm.plugin --arch arm64

      - name: Upload macOS ARM plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_mac_arm
          path: build/ctools_mac_arm.plugin
          if-no-files-found: error

  # ===========================================================================
  # macOS Intel (x86_64) Build
  # ===========================================================================
  build-macos-intel:
    runs-on: macos-15-intel  # Standard Intel runner (x86_64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build OpenMP for macOS 11
        run: python3 scripts/build_macos_openmp.py x86_64 "$RUNNER_TEMP/libomp" --work "$RUNNER_TEMP/llvm-openmp"

      - name: Build macOS plugin
        run: make macos-intel LIBOMP_PREFIX="$RUNNER_TEMP/libomp" BUILD_REVISION=${{ github.sha }}

      - name: Check macOS dependency contract
        run: python3 validation/check_dependencies.py macos build/ctools_mac_x86.plugin --arch x86_64

      - name: Upload macOS Intel plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_mac_x86
          path: build/ctools_mac_x86.plugin
          if-no-files-found: error

  # ===========================================================================
  # Windows x64 Build
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache MSYS2 packages
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pkgs-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openmp
            mingw-w64-x86_64-winpthreads-git
            mingw-w64-x86_64-python

      - name: Build Windows plugin
        shell: msys2 {0}
        run: make windows BUILD_REVISION=${{ github.sha }}

      - name: Check Windows dependency contract
        shell: msys2 {0}
        run: python validation/check_dependencies.py windows build/ctools_windows.plugin

      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: ctools_windows
          path: build/ctools_windows.plugin
          if-no-files-found: error

  # Licensed runner required for publication. Configure CTOOLS_STATA_RUNNER as a JSON label list,
  # e.g. ["self-hosted", "macOS", "stata"], with the user's oldstata wrapper.
  # Never run untrusted pull-request code on a persistent licensed runner.
  stata-validation:
    if: github.event_name != 'pull_request' && vars.CTOOLS_STATA_RUNNER != ''
    needs: [build-macos-arm, build-macos-intel]
    runs-on: ${{ fromJSON(vars.CTOOLS_STATA_RUNNER || '["self-hosted","macOS","stata"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ctools_mac_*
          path: build
          merge-multiple: true
      - name: Prepare pinned offline examples
        run: python3 scripts/fetch_validation_data.py
      - name: Run complete Stata correctness gate
        run: python3 validation/run_stata_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stata-audit-log
          path: validation/audit_ci.log

  # ===========================================================================
  # Combine all artifacts into single release package
  # ===========================================================================
  package:
    needs: [build-linux, build-macos-arm, build-macos-intel, build-windows, stata-validation]
    if: >-
      always() && !cancelled() &&
      needs.build-linux.result == 'success' &&
      needs.build-macos-arm.result == 'success' &&
      needs.build-macos-intel.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (github.event_name == 'pull_request' || needs.stata-validation.result == 'success')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: plugins

      - name: Organize plugins
        run: |
          mkdir -p release/build

          # Move plugins to build directory
          cp plugins/ctools_linux/ctools_linux.plugin release/build/
          cp plugins/ctools_mac_arm/ctools_mac_arm.plugin release/build/
          cp plugins/ctools_mac_x86/ctools_mac_x86.plugin release/build/
          cp plugins/ctools_windows/ctools_windows.plugin release/build/

          # Copy ado and help files
          cp build/*.ado build/*.sthlp release/build/
          cp build/ctools.pkg build/stata.toc build/LICENSE build/THIRD_PARTY_NOTICES release/build/
          printf '%s\n' '${{ github.sha }}' > release/SOURCE_COMMIT
          python3 scripts/sync_release.py --check
          python3 validation/check_package.py release/build

          echo "Release package contents:"
          ls -la release/build/

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: ctools-all-platforms
          path: release/
          if-no-files-found: error

  # ===========================================================================
  # Commit built plugins to repository
  # ===========================================================================
  commit-plugins:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ctools-all-platforms
          path: release

      - name: Copy plugins to build directory
        run: |
          mkdir -p build
          cp release/build/*.plugin build/
          echo "Plugins copied to build/:"
          ls -la build/

      - name: Commit and push
        run: |
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main advanced after this build; refusing stale plugin publication"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/*.plugin
          git diff --staged --quiet || git commit -m "Update compiled plugins [skip ci]"
          git push origin HEAD:main

  # ===========================================================================
  # Create GitHub Release (only on release events)
  # ===========================================================================
  release:
    if: github.event_name == 'release'
    needs: [package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ctools-all-platforms
          path: release

      - name: Create release archive
        run: |
          cd release
          zip -r ../ctools-${{ github.event.release.tag_name }}.zip build/ SOURCE_COMMIT
          cd ..
          ls -la *.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: ctools-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
